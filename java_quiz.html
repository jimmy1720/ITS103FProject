<script>
//Define question and answer in array format
var questionSet = ["Which datatype cannot use double column when creating variables?",
				  "What is output in the following code<br><br>public class Person {<br><br>&nbsp&nbsp public String name = \"Susan\"<br><br>public Person(){<br><br>&nbsp&nbsp this.name = name;<br>}<br><br>public void setName(String newName) {<br>&nbsp&nbsp this.name = newName;<br>}<br><br>public static void main(String[] args){<br>&nbsp&nbsp Person p1 = new Person();<br>&nbsp&nbsp p1.setName(\"Derek\");<br>&nbsp&nbsp p1.setName(\"Zoo\");<br>&nbsp&nbsp System.out.println(p1.name);<br>}<br>}",
				  "789","12342","3249i49","29391"];
var answerSet = ["int","Zoo","C","D","E","F"]
var questionNo = 1;
var correctCount = 0;

//An array to store the model answers of the questionSet
var answerSet2 = [];
function showQuestion(){
	//Random from max to min number by using for loop
	for(var i = 5;i>=1;i--){
	  var randomNumber = Math.floor(Math.random() * i);
	  answerSet2.push(answerSet[randomNumber]);
	  document.write("Question " + questionNo + ":" + questionSet[randomNumber]+ "<br><br><br>" );
	  questionNo++;
	  //Remove the question and answers that selected by randomNumber
	  questionSet.splice(randomNumber,1);
	  answerSet.splice(randomNumber,1);
	}
	document.write(answerSet2)
}
function countAnswer(){
	for(var i = 1;i<=5;i++){
	const usersInput = document.getElementById("q"+i).value;
	//Check if user's input == the answer, if yes then correctCount + 1
	if(usersInput == answerSet2[i-1]){
		correctCount += 1;
	  }else{
		alert("Wrong answer for question "+ i);
	  }
	}
	alert("Total correct questions = " +correctCount);
}
showQuestion();
</script>
