<script>
//Define question and answer in array format
var questionSet = ["Which datatype is using single colon to create variable?",
				  "What is the output in the following code<br><br>public class Person {<br><br>&nbsp&nbsp public String name = \"Susan\"<br><br>public Person(){<br><br>&nbsp&nbsp this.name = name;<br>}<br><br>public void setName(String newName) {<br>&nbsp&nbsp this.name = newName;<br>}<br><br>public static void main(String[] args){<br>&nbsp&nbsp Person p1 = new Person();<br>&nbsp&nbsp p1.setName(\"Derek\");<br>&nbsp&nbsp p1.setName(\"Zoo\");<br>&nbsp&nbsp System.out.println(p1.name);<br>}<br>}",
				  "Write the import statement for scanner",
				  "Will the following method result in a syntax error?(Answer T for true and F for false)<br>&nbsp&nbsp public void aMethod();",
				  "Create a varaible called age and assign 20 in integer format",
				  "int a = 10;<br>String b = \"10\"<br> is a == b?(Answer T for true and F for false)"];
var answerSet = ["char","Zoo","import java.util.Scanner;","T","int age = 20;","F"]
var questionNo = 1;
//An array to store the answers of the surffled questionSet
var answerSet2 = [];
function showQuestion(){
	//Random from max to min number by using for loop
	for(var i = 6;i>1;i--){
	  var randomNumber = Math.floor(Math.random() * i);
	  answerSet2.push(answerSet[randomNumber]);
	  document.write("Question " + questionNo + ":<br>" + questionSet[randomNumber]+ "<br><br><br><br><br><br>" );
	  questionNo++;
	  //Remove the question and answers that selected by randomNumber
	  questionSet.splice(randomNumber,1);
	  answerSet.splice(randomNumber,1);
	}
}
function countAnswer(){
    var correctCount = 0;
	for(var i = 1;i<=5;i++){
	const usersInput = document.getElementById("q"+i).value;
	//Check if user's input == the answer, if yes then correctCount + 1
	if(usersInput == answerSet2[i-1]){
		correctCount += 1;
	  }
	}
	alert("You have answered " +correctCount + " correctly");
}

function showAnswer(){
	for(var i = 1; i <= 5; i++){
		alert("Question "+ i + " answer: " +answerSet2[i-1]);
	}
};
showQuestion();
</script>
